name: Publish ilang-python

on:
  push:
    tags:
      - "ilang-python-v*"
  workflow_dispatch:

jobs:
  build:
    name: Build wheel (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-13
          - macos-14

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build macOS wheel
        if: runner.os == 'macOS'
        run: |
          python -m pip install --upgrade pip build twine
          python ilang-python/build-release.py
          mkdir -p wheelhouse
          cp ilang-python/dist/*.whl wheelhouse/

      - name: Build Linux manylinux wheel
        if: runner.os == 'Linux'
        run: |
          mkdir -p wheelhouse
          docker run --rm \
            -v "$PWD:/io" \
            quay.io/pypa/manylinux_2_28_x86_64:2026.06.04-1 \
            /bin/bash -euxo pipefail -c '
              export PATH="/opt/python/cp312-cp312/bin:$HOME/.cargo/bin:$PATH"
              curl https://sh.rustup.rs -sSf | sh -s -- -y --profile minimal
              python -m pip install --upgrade pip build auditwheel

              cd /io
              rm -rf ilang-python/dist ilang-python/build ilang-python/*.egg-info
              rm -f ilang-python/src/ilang/libi_core.so ilang-python/src/ilang/libi_core.dylib

              cargo build -p i-core --release
              cp target/release/libi_core.so ilang-python/src/ilang/

              cd ilang-python
              python -m build --wheel
              auditwheel repair dist/*.whl -w /io/wheelhouse

              python -m pip install --no-deps --force-reinstall /io/wheelhouse/*.whl
              python -c "import ilang; print('\''ilang import ok'\'')"

              rm -f /io/ilang-python/src/ilang/libi_core.so
            '

      - name: Check wheels
        run: |
          python -m pip install --upgrade twine
          python -m twine check wheelhouse/*

      - uses: actions/upload-artifact@v4
        with:
          name: ilang-python-wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/ilang-python-v')
    environment: pypi
    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: wheelhouse
          merge-multiple: true

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: wheelhouse
