[project]
name = "ilang-python"
version = "0.1.0"
description = "Python front-end for 𝚒"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = []
classifiers = [
    "License :: OSI Approved :: Apache Software License",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ilang"]
pure-python = false
artifacts = [
    "src/ilang/libi_core.so",
    "src/ilang/libi_core.dylib",
]

[tool.ruff]
target-version = "py310"

[tool.ty]
